<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Private</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #101114;
      color: #f2f2f2;
      font-family: Arial, sans-serif;
    }
    .login {
      width: min(340px, calc(100% - 40px));
      min-height: 100vh;
      margin: auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
    }
    input, button {
      padding: 13px 14px;
      border: 1px solid #34363d;
      border-radius: 8px;
      background: #1b1d22;
      color: #fff;
      font: inherit;
    }
    button { cursor: pointer; background: #30333b; }
    button:hover { background: #3b3f49; }
    #error { min-height: 18px; margin: 0; color: #ff6b6b; font-size: 14px; }
    #app { display: none; min-height: 100vh; }
    .topbar {
      height: 58px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      background: #17191e;
      border-bottom: 1px solid #30323a;
    }
    .tab {
      width: auto;
      min-width: 90px;
      padding: 10px 16px;
      border: 0;
      border-radius: 7px;
      color: #aaaeb8;
      background: transparent;
    }
    .tab.active { color: white; background: #30333b; }
    .view { height: calc(100vh - 58px); }
    .view iframe { width: 100%; height: 100%; border: 0; background: #101114; }
    @media (max-width: 520px) {
      .topbar { padding: 0 8px; }
      .tab { min-width: 0; flex: 1; }
    }
  </style>
</head>
<body>
  <main class="login" id="login">
    <input id="password" type="password" placeholder="Password" autocomplete="off" autofocus>
    <button id="enter" type="button">Enter</button>
    <p id="error" aria-live="polite"></p>
  </main>

  <main id="app">
    <nav class="topbar">
      <button class="tab active" data-tab="videis" type="button">videis</button>
      <button class="tab" data-tab="videos" type="button">videos</button>
    </nav>
    <section class="view">
      <iframe id="contentFrame" title="Private content" allow="autoplay; fullscreen" referrerpolicy="no-referrer"></iframe>
    </section>
  </main>

  <script>
    const APP_URL = 'https://script.google.com/macros/s/AKfycby2Ph4fE_YQAQOWDaaI9bR5kOsVuuSBbARJ2_IMLk-Dc0bjO5RYapbjE-tp5DDZVZbb/exec';
    const passwordInput = document.getElementById('password');
    const error = document.getElementById('error');
    const login = document.getElementById('login');
    const app = document.getElementById('app');
    const frame = document.getElementById('contentFrame');

    function enterSite() {
      if (passwordInput.value.toLowerCase() === 'diaper') {
        login.style.display = 'none';
        app.style.display = 'block';
        frame.src = APP_URL;
      } else {
        error.textContent = 'Wrong password';
        passwordInput.select();
      }
    }

    document.getElementById('enter').addEventListener('click', enterSite);
    passwordInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') enterSite();
    });

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(item => item.classList.remove('active'));
        tab.classList.add('active');
        frame.src = APP_URL;
      });
    });
  </script>
</body>
</html>
