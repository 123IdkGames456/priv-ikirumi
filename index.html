<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Private Gallery</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #101114; color: #f2f2f2; font-family: Arial, sans-serif; }
    .login { width: min(340px, calc(100% - 40px)); min-height: 100vh; margin: auto; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
    input, button { padding: 13px 14px; border: 1px solid #34363d; border-radius: 8px; background: #1b1d22; color: #fff; font: inherit; }
    button { cursor: pointer; background: #30333b; }
    button:hover { background: #3b3f49; }
    #error { min-height: 18px; margin: 0; color: #ff6b6b; font-size: 14px; }
    #app { display: none; min-height: 100vh; }
    .topbar { height: 60px; display: flex; align-items: center; gap: 8px; padding: 0 18px; background: #17191e; border-bottom: 1px solid #30323a; }
    .tab { width: auto; min-width: 100px; padding: 10px 17px; border: 0; border-radius: 7px; color: #aaaeb8; background: transparent; }
    .tab.active { color: white; background: #30333b; }
    .content { padding: 22px; }
    .status { color: #a6a9b2; margin: 0 0 18px; font-size: 14px; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
    .item { min-width: 0; overflow: hidden; border: 1px solid #30323a; border-radius: 10px; background: #191b20; }
    .item img, .item video { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: contain; background: #08090b; }
    .name { padding: 10px 12px; color: #d8dae0; font-size: 13px; overflow-wrap: anywhere; }
    .empty { color: #a6a9b2; padding: 36px 8px; text-align: center; }
    @media (max-width: 520px) { .topbar { padding: 0 8px; } .tab { min-width: 0; flex: 1; } .content { padding: 14px; } .gallery { grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 10px; } }
  </style>
</head>
<body>
  <main class="login" id="login">
    <input id="password" type="password" placeholder="Password" autocomplete="off" autofocus>
    <button id="enter" type="button">Enter</button>
    <p id="error" aria-live="polite"></p>
  </main>

  <main id="app">
    <nav class="topbar">
      <button class="tab active" data-tab="images" type="button">Images</button>
      <button class="tab" data-tab="videos" type="button">Videos</button>
    </nav>
    <section class="content">
      <p class="status" id="status">Loading files…</p>
      <div class="gallery" id="gallery"></div>
    </section>
  </main>

  <script>
    const APP_URL = 'https://script.google.com/macros/s/AKfycby2Ph4fE_YQAQOWDaaI9bR5kOsVuuSBbARJ2_IMLk-Dc0bjO5RYapbjE-tp5DDZVZbb/exec';
    const passwordInput = document.getElementById('password');
    const error = document.getElementById('error');
    const login = document.getElementById('login');
    const app = document.getElementById('app');
    const gallery = document.getElementById('gallery');
    const status = document.getElementById('status');
    let galleryData = null;
    let activeTab = 'images';

    function enterSite() {
      if (passwordInput.value.toLowerCase() === 'diaper') {
        login.style.display = 'none';
        app.style.display = 'block';
        loadFiles();
      } else {
        error.textContent = 'Wrong password';
        passwordInput.select();
      }
    }

    function loadFiles() {
      status.textContent = 'Loading files…';
      const script = document.createElement('script');
      const callbackName = '__privateGalleryCallback';
      window[callbackName] = data => {
        delete window[callbackName];
        script.remove();
        if (!data || !data.ok) {
          status.textContent = data && data.error ? data.error : 'Could not load files.';
          return;
        }
        galleryData = data;
        renderTab();
      };
      script.onerror = () => {
        delete window[callbackName];
        script.remove();
        status.textContent = 'Could not connect to the gallery. Check that the Apps Script is deployed with access for anyone.';
      };
      script.src = APP_URL + '?action=list&callback=' + callbackName + '&_=' + Date.now();
      document.body.appendChild(script);
    }

    function renderTab() {
      if (!galleryData) return;
      const files = activeTab === 'images' ? (galleryData.images || []) : (galleryData.videos || []);
      gallery.replaceChildren();
      status.textContent = files.length + (activeTab === 'images' ? ' images' : ' videos');
      if (!files.length) {
        gallery.innerHTML = '<div class="empty">No ' + activeTab + ' found.</div>';
        return;
      }

      files.forEach(file => {
        const card = document.createElement('article');
        card.className = 'item';
        if (activeTab === 'images') {
          const image = document.createElement('img');
          image.src = file.url;
          image.alt = file.name || 'Image';
          image.loading = 'lazy';
          image.onerror = () => { image.alt = 'Image could not be loaded'; };
          card.appendChild(image);
        } else {
          const video = document.createElement('video');
          video.controls = true;
          video.preload = 'metadata';
          video.src = file.url;
          card.appendChild(video);
        }
        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = file.name || 'Untitled';
        card.appendChild(name);
        gallery.appendChild(card);
      });
    }

    document.getElementById('enter').addEventListener('click', enterSite);
    passwordInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') enterSite();
    });
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(item => item.classList.remove('active'));
        tab.classList.add('active');
        activeTab = tab.dataset.tab;
        renderTab();
      });
    });
  </script>
</body>
</html>
